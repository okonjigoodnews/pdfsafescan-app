<script>
const { useState, useEffect, useRef, useCallback, createElement: h, Fragment } = React;
const API = 'https://advanced-pdf-safescan-api.onrender.com';

// ── Helpers ──
function cls(...args) { return args.filter(Boolean).join(' '); }
function pct(v) { return v != null ? (v * 100).toFixed(1) + '%' : '—'; }
function shortHash(h) { return h ? h.slice(0, 12) + '…' : '—'; }
function fmtDate(ts) {
  if (!ts) return '—';
  try { const d = new Date(ts); return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); }
  catch { return String(ts); }
}

function verdictColor(label) {
  const l = (label||'').toLowerCase();
  if (l === 'benign') return 'green';
  if (l === 'malicious') return 'red';
  return 'orange';
}

// ── Shield SVG ──
function ShieldIcon({ verdict, size = 72 }) {
  const l = (verdict||'').toLowerCase();
  const color = l === 'benign' ? 'var(--green)' : l === 'malicious' ? 'var(--red)' : 'var(--orange)';
  const icon = l === 'benign'
    ? h('path', { d: 'M9 12l2 2 4-4', stroke: 'white', strokeWidth: 2, fill: 'none', strokeLinecap: 'round', strokeLinejoin: 'round' })
    : l === 'malicious'
    ? h('g', { stroke: 'white', strokeWidth: 2, strokeLinecap: 'round' },
        h('line', { x1: 9, y1: 9, x2: 15, y2: 15 }),
        h('line', { x1: 15, y1: 9, x2: 9, y2: 15 })
      )
    : h('g', { stroke: 'white', strokeWidth: 2, strokeLinecap: 'round' },
        h('line', { x1: 12, y1: 8, x2: 12, y2: 12 }),
        h('circle', { cx: 12, cy: 15, r: 0.5, fill: 'white' })
      );

  return h('svg', { width: size, height: size, viewBox: '0 0 24 24', className: 'shield-icon' },
    h('path', {
      d: 'M12 2l7 4v5c0 5.25-3.5 9.74-7 11-3.5-1.26-7-5.75-7-11V6l7-4z',
      fill: color
    }),
    icon
  );
}

// ── Logo ──
function Logo() {
  return h('svg', { width: 36, height: 36, viewBox: '0 0 36 36' },
    h('defs', null,
      h('linearGradient', { id: 'shieldGrad', x1: '0', y1: '0', x2: '1', y2: '1' },
        h('stop', { offset: '0%', stopColor: '#2196F3' }),
        h('stop', { offset: '100%', stopColor: '#00BCD4' })
      )
    ),
    h('rect', { width: 36, height: 36, rx: 8, fill: '#1a2332' }),
    h('path', {
      d: 'M18 6l10 5.5v7c0 6.5-4.2 11.8-10 13.5-5.8-1.7-10-7-10-13.5v-7L18 6z',
      fill: 'none', stroke: 'url(#shieldGrad)', strokeWidth: 2.2
    }),
    h('path', {
      d: 'M13 18l3.5 3.5L23 14',
      fill: 'none', stroke: '#4CAF50', strokeWidth: 2.4, strokeLinecap: 'round', strokeLinejoin: 'round'
    })
  );
}

// ── Bar Chart ──
function BarChart({ data, colorFn, labelKey = 'label', valueKey = 'value' }) {
  const max = Math.max(...data.map(d => d[valueKey]), 1);
  const tooltipEl = document.getElementById('tooltip');

  function showTip(e, d) {
    tooltipEl.textContent = d[labelKey] + ': ' + d[valueKey];
    tooltipEl.style.left = e.clientX + 12 + 'px';
    tooltipEl.style.top = e.clientY - 30 + 'px';
    tooltipEl.classList.add('visible');
  }
  function hideTip() { tooltipEl.classList.remove('visible'); }

  return h('div', { className: 'chart-container' },
    h('div', { className: 'bar-chart' },
      data.map((d, i) =>
        h('div', { className: 'bar-group', key: i },
          h('div', { className: 'bar-value' }, d[valueKey]),
          h('div', {
            className: 'bar',
            style: {
              height: Math.max((d[valueKey] / max) * 120, 2) + 'px',
              background: colorFn ? colorFn(d, i) : 'var(--chart-1)'
            },
            onMouseMove: (e) => showTip(e, d),
            onMouseLeave: hideTip,
            role: 'img',
            'aria-label': d[labelKey] + ': ' + d[valueKey]
          }),
          h('div', { className: 'bar-label' }, d[labelKey])
        )
      )
    )
  );
}

// ── API layer ──
async function checkHealth() {
  try {
    const r = await fetch(API + '/api/health', { signal: AbortSignal.timeout(8000) });
    return r.ok;
  } catch { return false; }
}

async function scanFile(file, onProgress) {
  const form = new FormData();
  form.append('file', file);
  onProgress?.('uploading');
  const r = await fetch(API + '/api/scan/file', { method: 'POST', body: form });
  if (!r.ok) {
    const body = await r.text();
    throw new Error(body || 'Scan failed with status ' + r.status);
  }
  return r.json();
}

async function fetchHistory() {
  try {
    const r = await fetch(API + '/api/scan/recent', { signal: AbortSignal.timeout(10000) });
    if (!r.ok) return [];
    const data = await r.json();
    return Array.isArray(data) ? data : (data.scans || data.results || []);
  } catch { return []; }
}

// ── Simple Mode ──
function SimpleMode({ addSessionScan }) {
  const [file, setFile] = useState(null);
  const [scanning, setScanning] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [dragover, setDragover] = useState(false);
  const inputRef = useRef();

  function handleFiles(files) {
    if (!files || !files.length) return;
    const f = files[0];
    if (f.type !== 'application/pdf' && !f.name.toLowerCase().endsWith('.pdf')) {
      setError('Please select a PDF file.');
      return;
    }
    setFile(f);
    setError(null);
    setResult(null);
  }

  async function doScan() {
    if (!file) return;
    setScanning(true);
    setError(null);
    try {
      const data = await scanFile(file);
      data.file_name = file.name;
      setResult(data);
      addSessionScan?.(data);
    } catch (e) {
      setError(e.message || 'Scan failed. The backend may be starting up — try again in a moment.');
    } finally {
      setScanning(false);
    }
  }

  function reset() {
    setFile(null);
    setResult(null);
    setError(null);
  }

  if (result) {
    const v = (result.final_label || 'suspicious').toLowerCase();
    return h('div', null,
      h('div', { className: cls('verdict-card', v) },
        h(ShieldIcon, { verdict: v }),
        h('h2', { className: 'verdict-label' }, result.final_label || 'Unknown'),
        h('p', { className: 'verdict-confidence' },
          'Confidence: ', pct(result.final_confidence),
          ' · Rule severity: ', result.rule_severity || '—'
        ),
        result.recommendation && h('p', { className: 'verdict-recommendation' }, result.recommendation),
        h('div', { className: 'verdict-details' },
          h('div', { className: 'detail-item' },
            h('div', { className: 'label' }, 'ML Label'),
            h('div', { className: 'value' }, result.ml_label || '—')
          ),
          h('div', { className: 'detail-item' },
            h('div', { className: 'label' }, 'ML Confidence'),
            h('div', { className: 'value' }, pct(result.ml_confidence))
          ),
          h('div', { className: 'detail-item' },
            h('div', { className: 'label' }, 'Rule Score'),
            h('div', { className: 'value' }, result.rule_score != null ? result.rule_score.toFixed(2) : '—')
          ),
          h('div', { className: 'detail-item' },
            h('div', { className: 'label' }, 'SHA-256'),
            h('div', { className: 'value' }, shortHash(result.sha256))
          )
        ),
        h('button', { className: 'scan-another', onClick: reset }, 'Scan another file')
      ),
      result.triggered_rules && result.triggered_rules.length > 0 && h('div', { className: 'panel', style: { marginTop: 20 } },
        h('div', { className: 'panel-header' }, 'Triggered Rules'),
        h('div', { className: 'panel-body' },
          h('div', { className: 'rules-list' },
            result.triggered_rules.map((r, i) =>
              h('div', { className: 'rule-item', key: i },
                h('div', { className: 'rule-dot', style: { background: v === 'benign' ? 'var(--green)' : v === 'malicious' ? 'var(--red)' : 'var(--orange)' } }),
                h('span', { className: 'rule-name' }, r.name || r.rule_name || r),
                r.score != null && h('span', { className: 'rule-score' }, '+' + r.score)
              )
            )
          )
        )
      ),
      result.explanations && result.explanations.length > 0 && h('div', { className: 'panel', style: { marginTop: 16 } },
        h('div', { className: 'panel-header' }, 'Explanations'),
        h('div', { className: 'panel-body' },
          h('div', { className: 'rules-list' },
            result.explanations.map((ex, i) =>
              h('div', { className: 'rule-item', key: i },
                h('span', { className: 'rule-name' }, typeof ex === 'string' ? ex : ex.text || JSON.stringify(ex))
              )
            )
          )
        )
      )
    );
  }

  return h('div', null,
    h('div', {
      className: cls('scan-zone', dragover && 'dragover', file && 'has-file'),
      onClick: () => !file && inputRef.current?.click(),
      onDragOver: (e) => { e.preventDefault(); setDragover(true); },
      onDragLeave: () => setDragover(false),
      onDrop: (e) => { e.preventDefault(); setDragover(false); handleFiles(e.dataTransfer.files); }
    },
      h('input', {
        ref: inputRef,
        type: 'file',
        accept: '.pdf,application/pdf',
        className: 'sr-only',
        onChange: (e) => handleFiles(e.target.files)
      }),
      !file && !scanning && h(Fragment, null,
        h('svg', { className: 'scan-icon', viewBox: '0 0 80 80', fill: 'none' },
          h('rect', { x: 15, y: 8, width: 50, height: 64, rx: 6, stroke: 'var(--fg-faint)', strokeWidth: 2.5 }),
          h('path', { d: 'M28 28h24M28 38h24M28 48h16', stroke: 'var(--fg-faint)', strokeWidth: 2, strokeLinecap: 'round' }),
          h('circle', { cx: 54, cy: 56, r: 12, stroke: 'var(--accent)', strokeWidth: 2.5 }),
          h('line', { x1: 62, y1: 64, x2: 70, y2: 72, stroke: 'var(--accent)', strokeWidth: 2.5, strokeLinecap: 'round' })
        ),
        h('h2', null, 'Scan a PDF'),
        h('p', null, 'Drop a file here or click to browse')
      ),
      file && !scanning && h(Fragment, null,
        h('div', { className: 'file-info' },
          h('span', null, '📄'),
          h('span', { className: 'name' }, file.name),
          h('span', null, '(' + (file.size / 1024).toFixed(1) + ' KB)'),
          h('button', { className: 'clear-file', onClick: (e) => { e.stopPropagation(); reset(); }, 'aria-label': 'Remove file' }, '×')
        ),
        h('button', { className: 'scan-btn', onClick: (e) => { e.stopPropagation(); doScan(); } },
          h('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none' },
            h('path', { d: 'M12 2l7 4v5c0 5.25-3.5 9.74-7 11-3.5-1.26-7-5.75-7-11V6l7-4z', stroke: 'white', strokeWidth: 2, fill: 'none' })
          ),
          'Scan PDF'
        )
      ),
      scanning && h(Fragment, null,
        h('p', { style: { marginBottom: 8 } }, 'Analyzing…'),
        h('div', { className: 'progress-bar' },
          h('div', { className: 'progress-fill' })
        ),
        h('p', { style: { fontSize: 13, color: 'var(--fg-faint)', marginTop: 12 } }, 'Running hybrid ML + rule engine')
      )
    ),
    error && h('div', { className: 'error-banner' },
      h('span', null, '⚠'),
      h('span', null, error)
    )
  );
}

// ── Analyst Mode ──
function AnalystMode({ sessionScans, addSessionScan }) {
  const [history, setHistory] = useState([]);
  const [loading, setLoading] = useState(true);
  const [batchFiles, setBatchFiles] = useState([]);
  const [batchResults, setBatchResults] = useState({});
  const batchRef = useRef();

  useEffect(() => {
    fetchHistory().then(h => { setHistory(h); setLoading(false); });
  }, []);

  // Merge history + session scans, dedup by sha256
  const allScans = (() => {
    const seen = new Set();
    const merged = [];
    for (const s of sessionScans) {
      const key = s.sha256 || s.file_name || Math.random();
      if (!seen.has(key)) { seen.add(key); merged.push(s); }
    }
    for (const s of history) {
      const key = s.sha256 || s.file_name || Math.random();
      if (!seen.has(key)) { seen.add(key); merged.push(s); }
    }
    return merged;
  })();

  // Stats from all scans
  const total = allScans.length;
  const malicious = allScans.filter(s => (s.final_label||s.label||'').toLowerCase() === 'malicious').length;
  const suspicious = allScans.filter(s => (s.final_label||s.label||'').toLowerCase() === 'suspicious').length;
  const benign = allScans.filter(s => (s.final_label||s.label||'').toLowerCase() === 'benign').length;

  // Verdict distribution for chart
  const verdictDist = [
    { label: 'Benign', value: benign },
    { label: 'Suspicious', value: suspicious },
    { label: 'Malicious', value: malicious }
  ];

  function verdictBarColor(d) {
    if (d.label === 'Benign') return 'var(--green)';
    if (d.label === 'Malicious') return 'var(--red)';
    return 'var(--orange)';
  }

  // Batch upload
  function handleBatch(files) {
    if (!files) return;
    const pdfs = Array.from(files).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
    setBatchFiles(prev => [...prev, ...pdfs]);
  }

  async function runBatch() {
    for (const f of batchFiles) {
      if (batchResults[f.name]) continue;
      setBatchResults(prev => ({ ...prev, [f.name]: { status: 'scanning' } }));
      try {
        const data = await scanFile(f);
        data.file_name = f.name;
        setBatchResults(prev => ({ ...prev, [f.name]: { status: 'done', data } }));
        addSessionScan?.(data);
      } catch (e) {
        setBatchResults(prev => ({ ...prev, [f.name]: { status: 'error', error: e.message } }));
      }
    }
    // Refresh history
    const fresh = await fetchHistory();
    setHistory(fresh);
  }

  const pendingBatch = batchFiles.filter(f => !batchResults[f.name]);

  // Score chart from all scans
  const scoreData = allScans.slice(0, 8).map(s => ({
    label: (s.file_name || s.sha256 || '?').slice(0, 10),
    value: s.rule_score != null ? Number(s.rule_score) : 0
  })).reverse();

  return h('div', { className: 'analyst-grid' },
    // Stat row
    h('div', { className: 'stat-row' },
      h('div', { className: 'stat-card' },
        h('div', { className: 'stat-label' }, 'Total Scans'),
        h('div', { className: 'stat-value' }, total)
      ),
      h('div', { className: 'stat-card' },
        h('div', { className: 'stat-label' }, 'Malicious'),
        h('div', { className: cls('stat-value', 'red') }, malicious)
      ),
      h('div', { className: 'stat-card' },
        h('div', { className: 'stat-label' }, 'Suspicious'),
        h('div', { className: cls('stat-value', 'orange') }, suspicious)
      ),
      h('div', { className: 'stat-card' },
        h('div', { className: 'stat-label' }, 'Benign'),
        h('div', { className: cls('stat-value', 'green') }, benign)
      )
    ),

    // Charts row
    total > 0 && h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: 20 } },
      h('div', { className: 'panel' },
        h('div', { className: 'panel-header' }, 'Verdict Distribution'),
        h('div', { className: 'panel-body' },
          h(BarChart, { data: verdictDist, colorFn: verdictBarColor })
        )
      ),
      scoreData.length > 0 && h('div', { className: 'panel' },
        h('div', { className: 'panel-header' }, 'Rule Scores (Recent)'),
        h('div', { className: 'panel-body' },
          h(BarChart, { data: scoreData, colorFn: () => 'var(--chart-1)' })
        )
      )
    ),

    // Batch upload
    h('div', { className: 'panel' },
      h('div', { className: 'panel-header' },
        h('span', null, 'Batch Upload'),
        batchFiles.length > 0 && pendingBatch.length > 0 && h('button', {
          className: 'scan-btn',
          style: { padding: '6px 16px', fontSize: 13 },
          onClick: runBatch
        }, 'Scan All')
      ),
      h('div', { className: 'panel-body' },
        h('div', {
          className: 'batch-zone',
          onClick: () => batchRef.current?.click(),
          onDragOver: (e) => e.preventDefault(),
          onDrop: (e) => { e.preventDefault(); handleBatch(e.dataTransfer.files); }
        },
          h('input', {
            ref: batchRef,
            type: 'file',
            accept: '.pdf,application/pdf',
            multiple: true,
            className: 'sr-only',
            onChange: (e) => handleBatch(e.target.files)
          }),
          h('p', null, 'Drop multiple PDFs here or click to select')
        ),
        batchFiles.length > 0 && h('div', { className: 'batch-queue' },
          batchFiles.map((f, i) => {
            const r = batchResults[f.name];
            const statusText = !r ? 'Queued' : r.status === 'scanning' ? 'Scanning…' : r.status === 'error' ? 'Error' : (r.data?.final_label || 'Done');
            const statusColor = !r ? 'var(--fg-faint)' : r.status === 'scanning' ? 'var(--accent)' : r.status === 'error' ? 'var(--red)' : verdictColor(r.data?.final_label) === 'green' ? 'var(--green)' : verdictColor(r.data?.final_label) === 'red' ? 'var(--red)' : 'var(--orange)';
            return h('div', { className: 'batch-item', key: i },
              h('span', { className: 'b-name' }, f.name),
              h('span', { className: 'b-status', style: { color: statusColor } }, statusText)
            );
          })
        )
      )
    ),

    // History table
    h('div', { className: 'panel' },
      h('div', { className: 'panel-header' },
        h('span', null, 'Scan History'),
        loading && h('span', { style: { fontSize: 12, color: 'var(--fg-faint)' } }, 'Loading…')
      ),
      h('div', { className: 'panel-body' },
        allScans.length === 0 && !loading
          ? h('div', { className: 'empty-state' }, 'No scan history yet. Scan a file to get started.')
          : h('div', { className: 'table-scroll' },
              h('table', { className: 'history-table' },
                h('thead', null,
                  h('tr', null,
                    h('th', null, 'File'),
                    h('th', null, 'Verdict'),
                    h('th', null, 'Confidence'),
                    h('th', null, 'Rule Score'),
                    h('th', null, 'Time')
                  )
                ),
                h('tbody', null,
                  allScans.slice(0, 20).map((s, i) =>
                    h('tr', { key: i },
                      h('td', { className: 'mono' }, (s.file_name || s.sha256 || '—').slice(0, 24)),
                      h('td', null,
                        h('span', { className: cls('verdict-badge', (s.final_label||s.label||'unknown').toLowerCase()) },
                          s.final_label || s.label || '—'
                        )
                      ),
                      h('td', null, pct(s.final_confidence || s.confidence)),
                      h('td', { className: 'mono' }, s.rule_score != null ? Number(s.rule_score).toFixed(2) : '—'),
                      h('td', null, fmtDate(s.timestamp || s.report_timestamp))
                    )
                  )
                )
              )
            )
      )
    )
  );
}

// ── App ──
function App() {
  const [analystMode, setAnalystMode] = useState(false);
  const [online, setOnline] = useState(null);
  const [sessionScans, setSessionScans] = useState([]);

  function addSessionScan(result) {
    setSessionScans(prev => [{ ...result, timestamp: new Date().toISOString(), _session: true }, ...prev]);
  }

  useEffect(() => {
    checkHealth().then(setOnline);
    const id = setInterval(() => checkHealth().then(setOnline), 30000);
    return () => clearInterval(id);
  }, []);

  return h('div', null,
    h('header', { className: 'app-header' },
      h('div', { className: 'app-logo' },
        h(Logo),
        h('h1', null, 'PDFSafe', h('span', null, 'Scan'))
      ),
      h('div', { className: 'header-controls' },
        h('div', {
          className: cls('health-dot', online === true ? 'online' : online === false ? 'offline' : ''),
          title: online === true ? 'API online' : online === false ? 'API offline' : 'Checking…'
        }),
        h('label', { className: 'mode-toggle' },
          h('span', null, analystMode ? 'Analyst' : 'Simple'),
          h('div', {
            className: cls('toggle-track', analystMode && 'active'),
            onClick: () => setAnalystMode(p => !p),
            role: 'switch',
            'aria-checked': analystMode,
            tabIndex: 0,
            onKeyDown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setAnalystMode(p => !p); } }
          },
            h('div', { className: 'toggle-thumb' })
          )
        )
      )
    ),
    analystMode ? h(AnalystMode, { sessionScans, addSessionScan }) : h(SimpleMode, { addSessionScan })
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
